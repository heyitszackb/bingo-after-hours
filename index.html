<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#06282c"><title>Bingo After Hours</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="felt-background" aria-hidden="true"></canvas>
<main class="cabinet">
<header class="dashboard"><div class="score-panel" aria-label="Score"><span id="score">0</span><span class="dim">/</span><span id="target">10</span><small>pts</small><i id="progress"></i></div><div class="money-panel" aria-label="Money"><span>$</span><span id="money">5</span></div><button id="stages" aria-label="View stages"><svg viewBox="0 0 24 24"><path d="M3 20h6v-6h6V8h6V3M17 3h4v4"/></svg><span id="stage">1</span><small>/10</small></button></header>
<div class="call-meter" aria-label="Calls remaining"><svg viewBox="0 0 24 24"><path d="M12 3v9l5 3"/><circle cx="12" cy="12" r="9"/></svg><div id="call-dots"></div><span id="calls">12</span></div>
<section class="board-frame" aria-label="Drop a ball anywhere on the card"><div id="board" class="board" aria-label="Bingo card"></div><div id="celebration" class="celebration" aria-hidden="true"></div><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></section>
<section class="draw-area" aria-label="Drag a ball to the card, or tap to inspect"><div class="track"><div id="balls" class="balls"></div><div class="rail"></div></div></section>
<footer><button id="redraw" aria-label="Reroll for $1 without using a call"><svg viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></svg><span id="redraw-cost">$1</span></button><button id="bag" aria-label="Inspect bag"><svg viewBox="0 0 32 32"><path d="M10 3h12l-3 7 7 10v7H6v-7l7-10-3-7ZM11 10h10"/></svg><span id="bag-count">25</span></button></footer>
</main>
<dialog id="bag-dialog" aria-label="Remaining balls in the bag"><button class="close" aria-label="Close bag">×</button><div id="bag-grid"></div></dialog>
<dialog id="stage-dialog" aria-label="Ten stages"><button class="close" aria-label="Close stages">×</button><div id="stage-grid"></div></dialog>
<dialog id="result-dialog" aria-label="Stage result"><div id="result-icon"></div><div id="result-score"></div><button id="continue" aria-label="Continue">→</button></dialog>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div><div id="effects" aria-hidden="true"></div>
<div id="inspect-tooltip" role="tooltip" popover="manual" hidden><strong id="tooltip-number"></strong><p id="tooltip-effect" hidden>Nothing special</p></div>
<script type="module" src="app.js"></script></body></html>
